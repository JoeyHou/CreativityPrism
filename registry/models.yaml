# Canonical model registry. Single source of truth for model identity across tasks.
# Users always pass the canonical name (top-level key) to the runner.
# Adapters look up the per-task alias when invoking the underlying task code.
#
# Seeded from result_analysis/output_length_analysis.ipynb MODEL_NAME_MAP.
#
# Keys per model:
#   type:        api | open
#   provider:    openai | anthropic | google | deepseek | huggingface | ...
#   hf_id:       (open models only) HuggingFace repo id
#   aliases:
#     api_call:           the exact id used in api requests (api models)
#     aut_ttcw_cshort:    folder/alias used by tasks/aut_ttcw_cshort
#     ttct:               -model_name passed to ttct_inference.py
#     neocoder_dat:       --model-name for tasks/neocoder_dat; must be a key of
#                         __MODEL_TO_CLASS__ in that bundle's src/utils/configs.py
#     math_n_index:       model_name for tasks/math_n_index; must be a key of
#                         open_source_models or closed_source_model in that
#                         bundle's src/inference/inference_driver.py
#
# A missing alias is intentional: it means the bundle does not support that
# model, and lookup_alias fails with an explicit message rather than guessing.

models:

  # ===== API models =====
  GPT4.1:
    type: api
    provider: openai
    aliases:
      api_call: gpt-4.1-2025-04-14
      aut_ttcw_cshort: gpt_4.1
      ttct: gpt-4.1-2025-04-14
      neocoder_dat: gpt-4.1
      math_n_index: gpt-4.1

