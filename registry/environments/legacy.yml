# CreativityPrism "legacy" environment
# Covers: tasks/neocoder_dat (neocoder, dat)
# Runtime: vllm 0.5.3.post1, torch 2.3.1, Python 3.11, CUDA 12.1
#
# Why a second environment: neocoder_dat pins vllm 0.5.3.post1 / torch 2.3.1,
# which is incompatible with the vllm 0.7.x stack in modern.yml. Python is 3.11
# because vllm 0.5.3.post1 publishes no cp312 wheel.
#
# Create:  bash scripts/setup_envs.sh --env legacy
# Manual:  conda env create -f registry/environments/legacy.yml -p /your/prefix/creativityprism-legacy

name: creativityprism-legacy

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pytorch::pytorch=2.3.1
  - pytorch::pytorch-cuda=12.1
  - conda-forge::pyyaml
  - conda-forge::pandas
  - conda-forge::numpy=1.26.4
  - conda-forge::tqdm
  - conda-forge::requests
  - pip:
    - vllm==0.5.3.post1
    - transformers==4.49.0
    - accelerate==0.25.0
    - click>=8.1.7
    - backoff>=2.2.1
    - overrides>=7.4.0
    - openai>=1.6.1
    - anthropic>=0.51.0
    - google-genai>=1.0.0
    - boto3>=1.34.84
    - safetensors
    - sentencepiece
    - protobuf
    # DAT scoring (src/utils/dat_score.py); gensim 4.3.x requires scipy<1.14
    - scipy<1.14
    - gensim>=4.3,<5
