site_name: CreativityPrism
site_description: Benchmark for creative reasoning — results, data, and docs
site_url: https://joeyhou.github.io/CreativityPrism/
repo_url: https://github.com/joeyhou/creativityprism
edit_uri: edit/main/docs/

copyright: >-
  <span id="contact-us">Contact us:</span>
  <a href="mailto:joey.hou@pitt.edu">joey.hou@pitt.edu</a> ·
  <a href="mailto:nps99@pitt.edu">nps99@pitt.edu</a>

theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Leaderboard: leaderboard.md
  - Key findings: keyfindings.md
  - Method: method.md
  - Submit: submit.md
  - Adding a task: adding-a-task.md
  - Contact Us: contact.md
  
  # - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/onepage.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joeyhou/creativityprism

copyright: >-
  Contact: <a href="mailto:joey.hou@pitt.edu">joey.hou@pitt.edu</a> ·
  <a href="mailto:nps99@pitt.edu">nps99@pitt.edu</a>

plugins: []