site_name: CreativityPrism
site_description: Benchmark for creative reasoning — results, data, and docs
site_url: https://joeyhou.github.io/CreativityPrism/
repo_url: https://github.com/joeyhou/creativityprism
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Leaderboard: leaderboard.md
  - Key findings: keyfindings.md
  - Method: method.md
  - Data: data.md
  - Submit: submit.md
  - Adding a task: adding-a-task.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/onepage.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js

plugins: []