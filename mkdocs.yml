site_name: CreativityPrism
site_description: Benchmark for creative reasoning — results, data, and docs
site_url: https://joeyhou.github.io/creativityprism/
repo_url: https://github.com/joeyhou/creativityprism
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

# single-page: only "Home"
nav:
  - Home: index.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true


# extra_javascript:
