# CreativityPrism Task Configurations

tasks:
  # Divergent Thinking Domain
  aut:
    name: "Alternative Uses Task"
    domain: "divergent_thinking"
    dataset_path: "data/aut/objects.json"
    num_uses: 10
    metrics:
      quality: []
      novelty: ["aut_score"]
      diversity: []
    generation_config:
      temperature: 0.75
      max_tokens: 1024
      top_p: 1.0
  
  dat:
    name: "Divergent Association Task"
    domain: "divergent_thinking"
    dataset_path: null  # No input data needed
    num_rounds: 100
    num_words: 10
    metrics:
      quality: []
      novelty: []
      diversity: ["dat_score"]
    generation_config:
      temperature: 0.75
      max_tokens: 256
      top_p: 1.0
  
  ttct:
    name: "Torrance Test of Creative Thinking"
    domain: "divergent_thinking"
    dataset_path: "data/ttct/questions.json"
    metrics:
      quality: ["fluency", "elaboration"]
      novelty: ["originality"]
      diversity: ["flexibility"]
    generation_config:
      temperature: 0.75
      max_tokens: 2048
      top_p: 1.0
  
  # Creative Writing Domain
  ttcw:
    name: "Torrance Test of Creative Writing"
    domain: "creative_writing"
    dataset_path: "data/ttcw/plots.json"
    min_words: 2000
    metrics:
      quality: ["narrative_ending", "coherence", "elaboration", "world_building"]
      novelty: []
      diversity: ["emotional_flexibility"]
    generation_config:
      temperature: 0.75
      max_tokens: 4096
      top_p: 1.0
  
  creative_story:
    name: "Creative Short Story"
    domain: "creative_writing"
    dataset_path: "data/creative_story/keywords.json"
    max_sentences: 5
    metrics:
      quality: []
      novelty: ["novelty_score", "surpriseness"]
      diversity: ["ngram_diversity"]
    generation_config:
      temperature: 0.75
      max_tokens: 1024
      top_p: 1.0
  
  creativity_index:
    name: "Creativity Index"
    domain: "creative_writing"
    dataset_path: "data/creativity_index/prefixes.json"
    completion_length: 288
    metrics:
      quality: []
      novelty: ["l_uniqueness"]
      diversity: []
    generation_config:
      temperature: 1.0
      max_tokens: 288
      top_p: 0.9
  
  cs4:
    name: "Constrained Story Writing (CS4)"
    domain: "creative_writing"
    dataset_path: "data/cs4/stories.json"
    num_constraints: 5
    target_words: 500
    metrics:
      quality: ["quc"]
      novelty: ["rcs"]
      diversity: ["dist_n"]
    generation_config:
      temperature: 0.75
      max_tokens: 4096
      top_p: 1.0
  
  # Logical Reasoning Domain
  neocoder:
    name: "NeoCoder"
    domain: "logical_reasoning"
    dataset_path: "data/neocoder/problems.json"
    metrics:
      quality: ["convergence_k"]
      novelty: ["divergent_k"]
      diversity: []
    generation_config:
      temperature: 0.75
      max_tokens: 2048
      top_p: 1.0
  
  creative_math:
    name: "Creative Math"
    domain: "logical_reasoning"
    dataset_path: "data/creative_math/problems.json"
    metrics:
      quality: ["correctness"]
      novelty: ["novelty_ratio"]
      diversity: []
    generation_config:
      temperature: 0.75
      max_tokens: 2048
      top_p: 1.0

# Model Configurations
models:
  default:
    temperature: 0.75
    max_tokens: 2048
    top_p: 1.0
  
  # Example model configs
  gpt4:
    model_name: "gpt-4"
    model_type: "openai"
    temperature: 0.75
    max_tokens: 4096
  
  claude:
    model_name: "claude-3-sonnet-20240229"
    model_type: "anthropic"
    temperature: 0.75
    max_tokens: 4096
  
  llama:
    model_name: "meta-llama/Llama-3.1-8B-Instruct"
    model_type: "huggingface"
    temperature: 0.75
    max_tokens: 2048

# Evaluation Settings
evaluation:
  judge_model: "gpt-4"  # Default LLM judge for metrics that require it
  batch_size: 1
  
  # Metric normalization ranges
  metric_ranges:
    aut_score: [1.0, 5.0]
    dat_score: [0.0, 1.0]
    fluency: [1.0, 5.0]
    originality: [1.0, 5.0]
    flexibility: [1.0, 5.0]
    elaboration: [1.0, 5.0]
    coherence: [0.0, 1.0]
    narrative_ending: [0.0, 1.0]
    emotional_flexibility: [0.0, 1.0]
    world_building: [0.0, 1.0]
    novelty_score: [0.0, 1.0]
    surpriseness: [0.0, 1.0]
    ngram_diversity: [0.0, 1.0]
    l_uniqueness: [0.0, 1.0]
    quc: [0.0, 1.0]
    rcs: [0.0, 1.0]
    dist_n: [0.0, 1.0]
    convergence_k: [0.0, 1.0]
    divergent_k: [0.0, 1.0]
    correctness: [0.0, 1.0]
    novelty_ratio: [0.0, 1.0]
